<main>
    <h2>Make a Reservation</h2>
    <p>Book a table at Delicious Bites.</p>
    <form>
        <label for="name">Name:-</label>
        <input type="text"
               id="name"  
               name="name"
               placeholder="Enter Your Name"
               required >
        <br><br>
        
        <label for="Email">Email:-</label>
        <input type="text"
               id="Email"
               name="Email"
               placeholder="Enter Your Email"
               required>
        <br><br>

         <label for="num">Number:-</label>
        <input type="tel"
               id="num"
               name="num"
               placeholder="Enter Your Number"
               required>
               <br><br>
        <label for="date">Date:-</label>
        <input type="date"
               id="date"
               name="date"
               placeholder="Pick the date"
               required>
          <br> <br>
        <label for="time">Time:-</label>
        <input type="time"
               id="time"
               name="time"
               placeholder="pick The time"
               required>
<br> <br>
        <label for="guest">add the guest</label>
        <input type="number"
               id="guest"
               name="guest"
               placeholder="how many guest"
               required>
<br> <br>
        <label for="Food Prefernce">Select the food</label>
        <select>
            <option>
                Vegetarian
            </option>
            <option>
                Non-Vegetarian  
            </option>
            <option>
                Vegan
            </option>
        </select>
<br> <br>
    <label for="request">Write your request here</label>
     <input type="text"
            id="request"
            name="request"
            placeholder="Text Area"
        >
    <br> <br>
    <button type="submit">Reserve Table</button>
    </form>
</main>
</body>
